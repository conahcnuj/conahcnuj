name: Issue auto-drive

on:
  issues:
    types:
    # - opened
      - reopened
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number
  workflow_call:
    inputs:
      number:
        description: Issue or pull request number to continue
        required: true
        type: number
      repository:
        description: 'owner/name of the repository to drive (default: the caller repository)'
        required: false
        type: string
      environment:
        description: 'Environment holding the GitHub App secrets (default: conahcnuj)'
        required: false
        type: string
        default: conahcnuj
      effort:
        description: 'Effort variant to use (e.g. "max"); empty uses the model default'
        required: false
        type: string
        default: ""
      container_image:
        description: 'Container image to run the attempt job in (e.g. a DevContainer-derived image with preinstalled tooling). Empty (default) runs on the host.'
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        required: true
      INSTALLATION_ID:
        required: true
      PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: conahcnuj-${{ inputs.number || github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) }}
  cancel-in-progress: true

jobs:
  attempt:
    name: Attempt to resolve issue
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
      options: --user root
    environment: ${{ inputs.environment || 'conahcnuj' }}
    if: >-
      inputs.number ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'issues' ||
      (
        github.event_name == 'pull_request_review' &&
        github.event.pull_request.state == 'open' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.review.user.type != 'Bot' &&
        github.event.review.state != 'approved'
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.pull_requests[0] != null
      )
    defaults:
      run:
        shell: bash
    steps:
      # Fail fast on missing/invalid App secrets before spending time on
      # checkouts and installs: an empty or non-numeric installation id must
      # never reach the staging step (or the token endpoint).
      - name: Validate required App secrets
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${APP_ID}" ]]; then echo "::error::Missing APP_ID secret (pass secrets.APP_ID). See Getting started step 3." >&2; exit 1; fi
          if [[ -z "${INSTALLATION_ID}" ]]; then echo "::error::Missing installation-id (do not pass an empty INSTALLATION_ID; pass secrets.INSTALLATION_ID). See Getting started step 3." >&2; exit 1; fi
          if [[ ! "${INSTALLATION_ID}" =~ ^[0-9]+$ ]]; then echo "::error::Invalid installation-id (must be digits only; do not pass an empty installation id). See Getting started step 3." >&2; exit 1; fi
          if [[ -z "${PRIVATE_KEY}" ]]; then echo "::error::Missing PRIVATE_KEY secret (pass secrets.PRIVATE_KEY). See Getting started step 3." >&2; exit 1; fi

      # Check out the driver source. For the driver's own repository it lands in
      # the working tree root (which is also the target). For a cross-repository
      # call it lands in `driver/` so the target repository can be cloned
      # normally into the root (see below) instead of into a `target/` subdir.
      - name: Check out the driver source (same repository)
        if: ${{ (inputs.repository || github.repository) == job.workflow_repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}

      - name: Check out the driver source (cross-repository)
        if: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: driver

      # opencode is not preinstalled on runners; shared with ci.yml through the
      # install-opencode composite action (authenticated release lookup so
      # shared runner IPs do not hit the API rate limit). The composite action
      # lives in the driver checkout, which is at the root for a same-repository
      # run and under `driver/` for a cross-repository run.
      - name: Install opencode
        if: ${{ (inputs.repository || github.repository) == job.workflow_repository }}
        uses: ./.github/actions/install-opencode

      # In a cross-repository run the driver checkout lives under `driver/`,
      # which a later target checkout can wipe, making a local
      # `./driver/.github/actions/install-opencode` reference unresolvable
      # ("Can't find 'action.yml' ... under the driver repo"). Reference the
      # composite action from the conahcnuj repository directly instead, so no
      # local checkout of it is needed:
      # https://github.com/conahcnuj/conahcnuj/blob/main/.github/actions/install-opencode/action.yml
      - name: Install opencode (cross-repository)
        if: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        uses: conahcnuj/conahcnuj/.github/actions/install-opencode@main

      - name: Install the driver (cross-repository)
        if: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        shell: bash
        run: |
          # Install using the same procedure as README.md (install.ps1), which
          # deploys the driver, gh-app (two trees), plugin, global rules and
          # git-vc. The step may run inside a container image that does not
          # ship PowerShell, so install pwsh on demand first; install.ps1 itself
          # is the single source of truth for the layout.
          if ! command -v pwsh >/dev/null 2>&1 && ! command -v powershell >/dev/null 2>&1; then
            if command -v curl >/dev/null 2>&1; then
              curl -fsSL https://raw.githubusercontent.com/PowerShell/PowerShell/master/tools/install-powershell.sh | bash
            fi
          fi
          PWSH=""
          for candidate in pwsh powershell /usr/bin/pwsh /usr/local/bin/pwsh /opt/microsoft/powershell/7/pwsh; do
            if command -v "${candidate}" >/dev/null 2>&1; then
              PWSH="$(command -v "${candidate}")"
              break
            elif [[ -x "${candidate}" ]]; then
              PWSH="${candidate}"
              break
            fi
          done
          if [[ -z "${PWSH}" ]]; then
            echo "::error::PowerShell (pwsh/powershell) is required to run install.ps1, but could not be installed." >&2
            exit 1
          fi
          "${PWSH}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "${GITHUB_WORKSPACE}/driver/install.ps1"
          rm -rf "${GITHUB_WORKSPACE}/driver"

      # Check out the target repository normally (into the working tree root)
      # when it is not the driver's own repository. This runs after the driver
      # and opencode installs above so a target checkout can never wipe the
      # `driver/` tree they depend on. The driver is then run with the target
      # root as its working directory (no `cd target`), so branch creation,
      # fetches, Verified commits and the agent's edits all act on the target,
      # matching a local run.
      - name: Check out the target repository
        if: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.repository || github.repository }}
          fetch-depth: 0
          clean: false

      # The driver reads gh-app/app.env like any local run. The private key is
      # staged from the sealed secret, outside the work tree, so `git add -A`
      # can never pick it up. The App slug is not staged from a secret: it is
      # public (the <slug>[bot] login, and here also the repository name), and
      # a secret with that value made Actions mask the repository name in the
      # whole job log - the created PR URL included.
      - name: Stage App private key and app.env
        env:
          APP_ID: ${{ secrets.APP_ID }}
          INSTALLATION_ID: ${{ secrets.INSTALLATION_ID }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          CROSS_REPO: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
        run: |
          if [[ -z "${APP_ID}" ]]; then echo "::error::Missing APP_ID secret (pass secrets.APP_ID). See Getting started step 3." >&2; exit 1; fi
          if [[ -z "${INSTALLATION_ID}" ]]; then echo "::error::Missing installation-id (do not pass an empty INSTALLATION_ID; pass secrets.INSTALLATION_ID). See Getting started step 3." >&2; exit 1; fi
          if [[ ! "${INSTALLATION_ID}" =~ ^[0-9]+$ ]]; then echo "::error::Invalid installation-id (must be digits only; do not pass an empty installation id). See Getting started step 3." >&2; exit 1; fi
          if [[ -z "${PRIVATE_KEY}" ]]; then echo "::error::Missing PRIVATE_KEY secret (pass secrets.PRIVATE_KEY). See Getting started step 3." >&2; exit 1; fi
          if [[ "${CROSS_REPO}" == "true" ]]; then
            ghapp="${HOME}/.local/gh-app"
            ghapp_config="${HOME}/.config/opencode/gh-app"
          else
            ghapp="${GITHUB_WORKSPACE}/gh-app"
            ghapp_config="${GITHUB_WORKSPACE}/gh-app"
          fi
          pem="$RUNNER_TEMP/conahcnuj-app.pem"
          printf '%s\n' "$PRIVATE_KEY" > "$pem"
          chmod 600 "$pem"
          cat > "${ghapp}/app.env" <<EOF
          APP_ID="$APP_ID"
          INSTALLATION_ID="$INSTALLATION_ID"
          PRIVATE_KEY_PATH="$pem"
          BASH_EXE="/usr/bin/bash"
          EOF
          APP_SLUG="$(bash "${ghapp}/app-slug.sh")"
          printf 'APP_SLUG="%s"\n' "${APP_SLUG}" >> "${ghapp}/app.env"
          BOT_USER_ID="$(bash "${ghapp}/bot-user-id.sh")"
          printf 'BOT_USER_ID="%s"\n' "${BOT_USER_ID}" >> "${ghapp}/app.env"
          if [[ "${CROSS_REPO}" == "true" ]]; then
            mkdir -p "${ghapp_config}"
            cp "${ghapp}/app.env" "${ghapp_config}/app.env"
          fi

      - name: Run the conahcnuj driver
        env:
          # The repository to drive: the caller's repository for a reusable
          # call, unless the caller overrides it with `inputs.repository`. Set
          # explicitly (not left empty): for a cross-repository call the target
          # checkout below puts the driver's own repository name in origin, so
          # relying on origin detection would drive the wrong repository.
          CONAHCNUJ_REPO: ${{ inputs.repository || github.repository }}
          # When true the target is a separate checkout (the driver runs from
          # `driver/` while its working directory is the target root). For the
          # driver's own repository it runs from the workspace root.
          CONAHCNUJ_CROSS_REPO: ${{ (inputs.repository || github.repository) != job.workflow_repository }}
          CONAHCNUJ_INPUT: ${{ inputs.number || github.event_name == 'issues' && github.event.issue.number || github.event_name == 'pull_request_review' && github.event.pull_request.number || (github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number) }}
          CONAHCNUJ_EFFORT: ${{ inputs.effort }}
          OPENCODE_DISABLE_AUTOUPDATE: "true"
        run: |
          [[ "${CONAHCNUJ_INPUT}" =~ ^[1-9][0-9]*$ ]] || { echo "Invalid issue or pull request number: ${CONAHCNUJ_INPUT}" >&2; exit 1; }
          # Absolute path to the driver binary: beside the driver checkout (root
          # for a same-repository run, `driver/` for a cross-repository run). The
          # working directory stays the target root, so no `cd` is needed.
          if [[ "${CONAHCNUJ_CROSS_REPO}" == "true" ]]; then
            driver="${HOME}/.local/bin/conahcnuj"
            echo "Driving ${CONAHCNUJ_REPO} from the installed driver (target root is the working directory)." >&2
          else
            driver="${GITHUB_WORKSPACE}/bin/conahcnuj.sh"
          fi
          bash "${driver}" "${CONAHCNUJ_INPUT}"
